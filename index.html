<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCP 基金会 Wiki · 排版快捷编辑器</title>
<style>
  :root{
    --bg:#11131a; --panel:#171a22; --panel2:#1d212a; --panel3:#232833;
    --line:#2b313d; --txt:#e2e6ee; --muted:#8d95a5; --dim:#6b7383;
    --gold:#e2b64c; --accent:#5b8def; --danger:#d9534f; --ok:#49bd8c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt); overflow:hidden;
    font:14px/1.55 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    height:100vh; display:grid; gap:0;
    grid-template-columns:308px minmax(240px,1fr) minmax(300px,1.05fr);
    grid-template-rows:52px 1fr 30px;
    grid-template-areas:"head head head" "tools editor preview" "foot foot foot";
  }

  /* ============ 顶栏 ============ */
  header{
    grid-area:head; display:flex; align-items:center; gap:14px; padding:0 16px;
    background:linear-gradient(180deg,#1b1f29,#15181f);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:.3px; white-space:nowrap}
  .brand .logo{
    width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f3d488,#c99a2e 55%,#7a5c14);
    box-shadow:0 0 12px rgba(226,182,76,.28);
    display:grid;place-items:center;font-size:13px;color:#2a2100;font-weight:900;
  }
  .brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:2px}
  .spacer{flex:1}
  .top-actions{display:flex;gap:8px;align-items:center}
  button{font-family:inherit}

  .btn{
    background:var(--panel3); color:var(--txt); border:1px solid var(--line);
    border-radius:7px; padding:6px 12px; font-size:13px; cursor:pointer;
    transition:background .14s,border-color .14s,transform .05s;
    white-space:nowrap;
  }
  .btn:hover{background:#2c333f; border-color:#3b4557}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:rgba(226,182,76,.14); border-color:rgba(226,182,76,.45); color:#f0cd7d}
  .btn.primary:hover{background:rgba(226,182,76,.22)}
  .btn.ghost{background:transparent}
  .btn.ghost:hover{background:var(--panel3)}

  /* ============ 左侧工具面板 ============ */
  aside{
    grid-area:tools; background:var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; padding:10px 10px 22px;
  }
  aside::-webkit-scrollbar{width:9px}
  aside::-webkit-scrollbar-thumb{background:#2f3644;border-radius:9px;border:2px solid var(--panel)}
  aside::-webkit-scrollbar-track{background:transparent}

  .group{margin-bottom:12px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel2)}
  .group > h3{
    margin:0; padding:8px 11px; font-size:12.5px; font-weight:700; letter-spacing:.6px;
    color:#c8cfdd; background:#1f242e; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
  }
  .group > h3::before{
    content:""; width:3px; height:12px; border-radius:2px;
    background:var(--gold); box-shadow:0 0 7px rgba(226,182,76,.5);
  }
  .group > h3 .cnt{margin-left:auto; font-weight:400; font-size:11px; color:var(--dim)}
  .group > h3 .chev{color:var(--dim); font-size:10px; transition:transform .15s}
  .group.collapsed .chev{transform:rotate(-90deg)}
  .group.collapsed .grid{display:none}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:9px}
  .grid.one{grid-template-columns:1fr}
  .grid.three{grid-template-columns:1fr 1fr 1fr}

  .tool{
    position:relative; display:flex; flex-direction:column; gap:2px; align-items:flex-start;
    background:#252b36; border:1px solid #313846; border-radius:8px;
    padding:7px 9px; cursor:pointer; text-align:left;
    transition:background .13s, border-color .13s, box-shadow .13s;
  }
  .tool:hover{background:#2e3543; border-color:#404a5c; box-shadow:0 0 0 1px rgba(226,182,76,.12)}
  .tool:active{transform:translateY(1px)}
  .tool .t{font-size:13px; color:#e8ecf4; line-height:1.3}
  .tool .s{font-size:10.5px; color:#78818f; line-height:1.25; font-family:Consolas,Menlo,monospace; word-break:break-all}
  .tool .dot{position:absolute; top:6px; right:7px; width:5px; height:5px; border-radius:50%; background:var(--gold); opacity:.0; transition:opacity .15s}
  .tool:hover .dot{opacity:.85}

  .note{
    font-size:11.5px; color:var(--muted); line-height:1.65; padding:8px 11px 10px;
    border-top:1px dashed var(--line); background:#191d25;
  }
  .note b{color:#d3b06a; font-weight:600}
  .note code{background:#242b36; padding:1px 5px; border-radius:4px; font-family:Consolas,monospace; font-size:11px; color:#9fb0c8}

  /* ============ 编辑器 ============ */
  .pane{min-width:0; min-height:0; display:flex; flex-direction:column; position:relative}
  .pane-head{
    height:34px; flex:0 0 34px; display:flex; align-items:center; gap:8px; padding:0 12px;
    font-size:12px; color:var(--muted); background:#151820; border-bottom:1px solid var(--line);
  }
  .pane-head .tag{
    background:#20262f; border:1px solid var(--line); border-radius:5px; padding:1px 7px;
    font-family:Consolas,monospace; font-size:11px; color:#94a0b4;
  }
  .pane-head .spacer{flex:1}
  .switch{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:#9aa3b3;font-size:12px}
  .switch input{accent-color:var(--gold); width:13px;height:13px; cursor:pointer}

  #editorWrap{grid-area:editor; border-right:1px solid var(--line); background:#0f1218}
  #editor{
    flex:1; width:100%; border:0; outline:0; resize:none; background:transparent;
    color:#d9e0ea; padding:14px 16px; font:13.5px/1.72 Consolas,"Cascadia Mono",Menlo,"Microsoft YaHei",monospace;
    tab-size:2; letter-spacing:.1px; caret-color:var(--gold);
  }
  #editor::selection{background:rgba(226,182,76,.26)}
  #editor::-webkit-scrollbar{width:11px;height:11px}
  #editor::-webkit-scrollbar-thumb{background:#2c333f;border-radius:9px;border:2px solid #0f1218}
  #editor::-webkit-scrollbar-track{background:transparent}

  /* ============ 预览 ============ */
  #previewWrap{grid-area:preview; background:#0c0f14}
  #previewScroll{flex:1; overflow:auto; padding:0}
  #previewScroll::-webkit-scrollbar{width:11px}
  #previewScroll::-webkit-scrollbar-thumb{background:#2c333f;border-radius:9px;border:2px solid #0c0f14}

  .wiki{
    background:#fff; color:#1b1b1b; min-height:100%; padding:26px 32px 60px;
    font:15px/1.78 "Microsoft YaHei","PingFang SC",Georgia,serif;
    word-wrap:break-word;
  }
  .wiki h1,.wiki h2,.wiki h3,.wiki h4,.wiki h5,.wiki h6{
    font-family:"Microsoft YaHei","PingFang SC",Georgia,serif; color:#111;
    font-weight:700; line-height:1.35; margin:1.25em 0 .55em;
  }
  .wiki h1{font-size:1.85em; border-bottom:1px solid #ddd; padding-bottom:.22em}
  .wiki h2{font-size:1.5em; border-bottom:1px solid #e6e6e6; padding-bottom:.2em}
  .wiki h3{font-size:1.25em}
  .wiki h4{font-size:1.1em}
  .wiki h5,.wiki h6{font-size:1em; color:#333}
  .wiki > h1:first-child,.wiki > :first-child{margin-top:0}
  .wiki p{margin:.62em 0}
  .wiki a{color:#2952a3; text-decoration:none; border-bottom:1px solid rgba(41,82,163,.28)}
  .wiki a:hover{border-bottom-color:#2952a3}
  .wiki .para{margin:.62em 0}
  .wiki .para:first-child{margin-top:0}
  .wiki hr.wiki-hr{border:0; border-top:1px solid #ccc; margin:1.5em 0}

  /* 遮挡 */
  .wiki .blackbox{
    background:#333; color:transparent; border-radius:2px; padding:0 2px;
    cursor:help; transition:color .16s, background .16s;
  }
  .wiki .blackbox:hover{color:#fff}
  .wiki .whitebox{
    background:#fff; color:#fff; border-radius:2px; padding:0 2px; cursor:help;
    box-shadow:0 0 0 1px rgba(0,0,0,.06) inset; transition:color .16s;
  }
  .wiki .whitebox:hover{box-shadow:0 0 0 1px #c9ced8 inset; color:#fff}
  .wiki .spoiler{background:#14161a; color:#14161a; border-radius:2px; padding:0 2px; cursor:help; transition:color .16s}
  .wiki .spoiler:hover{color:#fff}
  .wiki.reveal .blackbox{color:#fff}
  .wiki.reveal .whitebox{color:#111; box-shadow:0 0 0 1px #c9ced8 inset}
  .wiki.reveal .spoiler{color:#fff}

  /* 块元素 */
  .wiki pre.wiki-pre{
    background:#f5f6f8; border:1px solid #dfe2e8; border-radius:5px;
    padding:11px 13px; overflow:auto; font:13px/1.6 Consolas,Menlo,monospace; margin:.9em 0;
  }
  .wiki .wiki-quote{
    border-left:4px solid #d8d8d8; margin:1em 0; padding:.15em 0 .15em 1em; color:#4a4a4a;
  }
  .wiki code.inline{
    background:#f1f2f4; border:1px solid #e2e5ea; border-radius:3px;
    padding:0 4px; font:.88em/1.4 Consolas,Menlo,monospace; color:#3a3f4a;
  }
  .wiki details.wiki-collapsible{
    border:1px solid #dfe2e8; border-radius:6px; margin:.9em 0; padding:2px 12px 4px; background:#fafbfc;
  }
  .wiki details.wiki-collapsible summary{cursor:pointer; color:#2952a3; padding:7px 0; font-weight:600}
  .wiki details.wiki-collapsible[open]{padding-bottom:10px}
  .wiki .wiki-tabs{display:flex; gap:10px; flex-wrap:wrap; margin:.9em 0}
  .wiki .wiki-tab{flex:1 1 210px; border:1px solid #dfe2e8; border-radius:6px; padding:0 12px 8px; background:#fafbfc}
  .wiki .wiki-tab-title{font-weight:700; color:#2952a3; border-bottom:1px solid #eceef2; padding:7px 0; margin-bottom:7px}
  .wiki table.wiki-table{border-collapse:collapse; margin:.9em 0; width:100%; font-size:.95em}
  .wiki .wiki-table td,.wiki .wiki-table th{border:1px solid #ccc; padding:6px 10px; vertical-align:top}
  .wiki .wiki-table th{background:#f1f2f4; text-align:left}
  .wiki .wiki-list{margin:.6em 0}
  .wiki .wiki-li{text-indent:-1.1em; padding-left:1.2em; margin:.15em 0}
  .wiki .wiki-ph{
    display:inline-block; background:#eef3ff; border:1px dashed #9aaee0; border-radius:4px;
    color:#3b5da8; padding:0 6px; font-size:.88em; font-family:Consolas,monospace; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:text-bottom;
  }
  .wiki .wiki-img{max-width:100%; border:1px solid #e0e3e8; border-radius:4px; display:block; margin:.6em 0}
  .wiki .wiki-center{text-align:center}
  .wiki .wiki-fn{font-size:.75em; color:#2952a3; vertical-align:super}
  .wiki .wiki-footnotes{margin-top:2em; border-top:1px solid #e6e6e6; padding-top:.6em; font-size:.88em; color:#555}
  .wiki .wiki-footnotes li{margin:.2em 0}
  .wiki .keycap{
    display:inline-block; background:#f4f5f7; border:1px solid #c9ced8; border-bottom-width:2px;
    border-radius:4px; padding:0 5px; font-size:.85em; font-family:Consolas,monospace;
  }
  .wiki .ruby .rt{font-size:60%; vertical-align:super; margin-left:1px; color:#666}

  #previewScroll .wiki-empty{color:#9aa0ad; padding:40px; text-align:center; font-size:13px}

  /* ============ 状态栏 ============ */
  footer{
    grid-area:foot; display:flex; align-items:center; gap:16px; padding:0 14px;
    background:#13161d; border-top:1px solid var(--line); font-size:11.5px; color:var(--dim);
  }
  footer .k{color:#95a0b3}
  footer .v{color:#cfd6e2; font-family:Consolas,monospace}
  footer .spacer{flex:1}
  footer .hint{color:#5e6675}
  #savedDot{width:6px;height:6px;border-radius:50%;background:#3d4552;display:inline-block;margin-right:5px;vertical-align:middle;transition:background .3s}
  #savedDot.on{background:var(--ok); box-shadow:0 0 7px rgba(73,189,140,.6)}

  /* ============ 弹窗 ============ */
  #mask{
    position:fixed; inset:0; background:rgba(6,8,12,.62); backdrop-filter:blur(3px);
    display:none; place-items:center; z-index:50;
  }
  #mask.on{display:grid}
  .dialog{
    width:400px; max-width:calc(100vw - 40px); background:var(--panel); border:1px solid #333b4a;
    border-radius:12px; box-shadow:0 24px 60px rgba(0,0,0,.6); overflow:hidden;
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{transform:scale(.96); opacity:0} to{transform:scale(1); opacity:1}}
  .dialog h4{margin:0; padding:13px 16px; font-size:13.5px; background:#1e232d; border-bottom:1px solid var(--line); color:#dfe4ee}
  .dialog .body{padding:15px 16px}
  .dialog input{
    width:100%; background:#12161d; border:1px solid #333b4a; border-radius:7px;
    color:#e4e9f2; padding:9px 11px; font:13.5px/1.4 Consolas,monospace; outline:0;
  }
  .dialog input:focus{border-color:rgba(226,182,76,.6); box-shadow:0 0 0 3px rgba(226,182,76,.12)}
  .dialog .tip{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.6}
  .dialog .foot{display:flex; gap:8px; justify-content:flex-end; padding:11px 16px 14px}

  /* 滚动条通用 */
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:#2c333f;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-track{background:transparent}

  @media (max-width:960px){
    body{overflow:auto}
    #app{
      height:auto; min-height:100vh; grid-template-columns:1fr;
      grid-template-rows:52px auto 45vh 45vh 30px;
      grid-template-areas:"head" "tools" "editor" "preview" "foot";
    }
    aside{max-height:38vh; border-right:0; border-bottom:1px solid var(--line)}
    #editorWrap{border-right:0; border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="logo">S</span>
      <span>SCP 中文分部 · 排版快捷编辑器</span>
      <small>Wikidot 语法图形化</small>
    </div>
    <div class="spacer"></div>
    <div class="top-actions">
      <button class="btn ghost" id="btnDemo" title="载入一段演示全部语法的示例文本">示例</button>
      <button class="btn ghost" id="btnImport" title="导入本地 .txt 文件">导入</button>
      <button class="btn ghost" id="btnClear" title="清空编辑器">清空</button>
      <button class="btn" id="btnDownload" title="下载为 .txt 文件">下载</button>
      <button class="btn primary" id="btnCopy" title="复制全部代码（Ctrl+S）">复制全部代码</button>
    </div>
  </header>

  <aside id="tools"></aside>

  <section class="pane" id="editorWrap">
    <div class="pane-head">
      <span>Wikidot 源码</span>
      <span class="tag">Ctrl+B 粗体 · Ctrl+I 斜体 · Ctrl+U 下划线</span>
      <span class="spacer"></span>
      <span class="tag" id="charsTag">0 字</span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="在这里写你的 SCP 文档，或者点左侧按钮插入语法…"></textarea>
  </section>

  <section class="pane" id="previewWrap">
    <div class="pane-head">
      <span>实时预览</span>
      <span class="spacer"></span>
      <label class="switch" title="勾选后显示黑块/白块里被遮挡的文字（仅影响预览）">
        <input type="checkbox" id="reveal"> 显示隐藏内容
      </label>
    </div>
    <div id="previewScroll"><div class="wiki" id="wiki"></div></div>
  </section>

  <footer>
    <span><span id="savedDot"></span><span class="k">自动保存</span></span>
    <span><span class="k">行数</span> <span class="v" id="fLines">0</span></span>
    <span><span class="k">字符</span> <span class="v" id="fChars">0</span></span>
    <span class="spacer"></span>
    <span class="hint">内容只保存在本机浏览器，不会上传到任何地方</span>
  </footer>
</div>

<div id="mask">
  <div class="dialog">
    <h4 id="dlgTitle">输入</h4>
    <div class="body">
      <input id="dlgInput" type="text" autocomplete="off">
      <div class="tip" id="dlgTip"></div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="dlgCancel">取消</button>
      <button class="btn primary" id="dlgOk">确定</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   SCP 基金会 Wiki 排版快捷编辑器
   - 左：分组按钮，点击即把 Wikidot 语法插入光标处/包裹选中文字
   - 中：源码
   - 右：自写 Wikidot 子集渲染器的实时预览
   ========================================================================= */

/* ------------------------- 1. 按钮数据 ------------------------- */
const GROUPS = [
  {
    title: "文字修饰",
    items: [
      { t:"粗体",   s:"**粗体**",          ins:{k:"wrap", pre:"**", post:"**", ph:"粗体文字"} },
      { t:"斜体",   s:"//斜体//",          ins:{k:"wrap", pre:"//", post:"//", ph:"斜体文字"} },
      { t:"下划线", s:"__下划线__",        ins:{k:"wrap", pre:"__", post:"__", ph:"下划线文字"} },
      { t:"删除线", s:"--删除线--",        ins:{k:"wrap", pre:"--", post:"--", ph:"删除的文字"} },
      { t:"等宽",   s:"{{等宽}}",          ins:{k:"wrap", pre:"{{", post:"}}", ph:"等宽字体"} },
      { t:"上标",   s:"^^上标^^",          ins:{k:"wrap", pre:"^^", post:"^^", ph:"上标"} },
      { t:"下标",   s:",,下标,,",          ins:{k:"wrap", pre:",,", post:",,", ph:"下标"} },
      { t:"拼音注音", s:'class="ruby"',    ins:{k:"wrap", pre:'[[span class="ruby"]]', post:'[[span class="rt"]]pīn yīn[[/span]][[/span]]', ph:"汉字"} },
      { t:"颜色",   s:"##cc3333|文字##",   ins:{k:"ask", q:"输入颜色：十六进制（不用写 #）或英文色名，如 cc3333 / red", def:"cc3333",
             build:v=>({k:"wrap", pre:"##"+String(v||"cc3333").trim().replace(/^#+/,"")+"|", post:"##", ph:"彩色文字"})} },
      { t:"文字色", s:"[[span style=]]",   ins:{k:"ask", q:"输入文字颜色（#hex 或英文名）", def:"#cc3333",
             build:v=>({k:"wrap", pre:'[[span style="color:'+(v||"#cc3333").trim()+'"]]', post:"[[/span]]", ph:"彩色文字"})} },
      { t:"高亮底", s:"background-color",  ins:{k:"wrap", pre:'[[span style="background-color:#ffe680; color:#000"]]', post:"[[/span]]", ph:"高亮文字"} },
      { t:"键帽",   s:"class=&quot;keycap&quot;", ins:{k:"wrap", pre:'[[span class="keycap"]]', post:"[[/span]]", ph:"Ctrl"} }
    ]
  },
  {
    title: "字号",
    items: [
      { t:"大字体", s:"[[size 150%]]", ins:{k:"wrap", pre:"[[size 150%]]", post:"[[/size]]", ph:"大字体"} },
      { t:"稍大",   s:"[[size 120%]]", ins:{k:"wrap", pre:"[[size 120%]]", post:"[[/size]]", ph:"稍大一点"} },
      { t:"小字体", s:"[[size 80%]]",  ins:{k:"wrap", pre:"[[size 80%]]",  post:"[[/size]]", ph:"小字体"} },
      { t:"更小",   s:"[[size 60%]]",  ins:{k:"wrap", pre:"[[size 60%]]",  post:"[[/size]]", ph:"很小的字"} },
      { t:"相对更大", s:"[[size larger]]", ins:{k:"wrap", pre:"[[size larger]]", post:"[[/size]]", ph:"larger"} },
      { t:"相对更小", s:"[[size smaller]]", ins:{k:"wrap", pre:"[[size smaller]]", post:"[[/size]]", ph:"smaller"} },
      { t:"自定义字号", s:"150% / 18px / 1.4em", ins:{k:"ask", q:"输入字号：150% / 18px / 1.4em / x-large", def:"150%",
             build:v=>({k:"wrap", pre:"[[size "+(v||"150%").trim()+"]]", post:"[[/size]]", ph:"文字"})} },
      { t:"行内字号", s:'style="font-size:"', ins:{k:"ask", q:"输入字号（同 CSS font-size）", def:"0.85em",
             build:v=>({k:"wrap", pre:'[[span style="font-size:'+(v||"0.85em").trim()+'"]]', post:"[[/span]]", ph:"文字"})} }
    ]
  },
  {
    title: "遮挡 / 隐藏内容",
    note:'SCP 常用「黑块」：<code>[[span class="blackbox"]]</code> 是站点主题里定义的样式（<code>#333 底色 + 透明文字，悬停显字</code>）。若某个站点没这个类，用「黑块(内联)」直接写样式，效果一样。白块同理：白底白字，在白色页面上看不见。',
    items: [
      { t:"黑块遮挡", s:'class="blackbox"', ins:{k:"wrap", pre:'[[span class="blackbox"]]', post:"[[/span]]", ph:"被遮住的内容"} },
      { t:"白块遮挡", s:'class="whitebox"', ins:{k:"wrap", pre:'[[span class="whitebox"]]', post:"[[/span]]", ph:"白底白字，看不见"} },

/* ------------------------- 2. 状态 & 元素 ------------------------- */
const els = {
  editor: document.getElementById("editor"),
  tools: document.getElementById("tools"),
  wiki: document.getElementById("wiki"),
  chars: document.getElementById("charsTag"),
  fLines: document.getElementById("fLines"),
  fChars: document.getElementById("fChars"),
  savedDot: document.getElementById("savedDot"),
  reveal: document.getElementById("reveal"),
  mask: document.getElementById("mask"),
  dlgTitle: document.getElementById("dlgTitle"),
  dlgInput: document.getElementById("dlgInput"),
  dlgTip: document.getElementById("dlgTip"),
  dlgOk: document.getElementById("dlgOk"),
  dlgCancel: document.getElementById("dlgCancel"),
};
const STORE_KEY = "scp-wiki-quick-editor/v1";
let saveTimer = null, renderTimer = null;

/* ------------------------- 3. 构建左侧按钮 ------------------------- */
function buildTools() {
  const frag = document.createDocumentFragment();
  GROUPS.forEach((g, gi) => {
    const box = document.createElement("section");
    box.className = "group";

    const h = document.createElement("h3");
    h.innerHTML = '<span class="chev">▼</span>' + g.title +
                  '<span class="cnt">' + g.items.length + "</span>";
    h.addEventListener("click", () => box.classList.toggle("collapsed"));
    box.appendChild(h);

    const grid = document.createElement("div");
    grid.className = "grid";
    g.items.forEach(it => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tool";
      b.title = it.t + " → " + it.s;
      b.innerHTML = '<span class="dot"></span><span class="t"></span><span class="s"></span>';
      b.querySelector(".t").textContent = it.t;
      b.querySelector(".s").textContent = it.s;
      b.addEventListener("click", () => doInsert(it));
      grid.appendChild(b);
    });
    box.appendChild(grid);

    if (g.note) {
      const n = document.createElement("div");
      n.className = "note";
      n.innerHTML = g.note;
      box.appendChild(n);
    }
    frag.appendChild(box);
  });
  els.tools.appendChild(frag);
}

/* ------------------------- 4. 插入逻辑 ------------------------- */
function putText(text, selStart, selEnd) {
  const ta = els.editor;
  ta.focus();
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.setSelectionRange(s, e);
  let ok = false;
  // execCommand 会进入浏览器的撤销栈，Ctrl+Z 可正常回退
  try { ok = document.execCommand("insertText", false, text); } catch (err) { ok = false; }
  if (!ok) { ta.setRangeText(text, s, e, "end"); }
  if (typeof selStart === "number") {
    ta.setSelectionRange(s + selStart, s + (typeof selEnd === "number" ? selEnd : selStart));
  }
  onChange();
}

function applyWrap(pre, post, ph) {
  const ta = els.editor;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const inner = sel.length ? sel : (ph || "");
  putText(pre + inner + post, pre.length, pre.length + inner.length);
}

function applyBlock(text) {
  const ta = els.editor;
  const s = ta.selectionStart;
  const before = ta.value.slice(0, s);
  const after = ta.value.slice(s);
  let pre = "", post = "";
  if (before.length && !/\n$/.test(before)) pre = "\n";
  if (after.length && !/^\n/.test(after)) post = "\n";

  const ci = text.indexOf("%C%");
  const body = ci >= 0 ? text.replace("%C%", "") : text;
  const caret = ci >= 0 ? ci : body.length;
  putText(pre + body + post, pre.length + caret, pre.length + caret);
}

function applyLine(prefix) {
  const ta = els.editor;
  const v = ta.value;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const lineStart = v.lastIndexOf("\n", s - 1) + 1;

  if (s === e) {                       // 没选中：改写当前行行首，先去掉已有标记，避免 # # / + ++ 叠加
    let lineEnd = v.indexOf("\n", lineStart);
    if (lineEnd === -1) lineEnd = v.length;
    const bare = v.slice(lineStart, lineEnd).replace(/^(?:\+{1,6}|[*#]+)\s+/, "");
    const next = prefix + bare;
    ta.setSelectionRange(lineStart, lineEnd);
    putText(next, next.length, next.length);
    return;
  }
  // 选中多行：给每一行加前缀（先去掉已有的同级标记，避免 + ++ 叠起来）
  let lineEnd = v.indexOf("\n", e);
  if (lineEnd === -1) lineEnd = v.length;
  const block = v.slice(lineStart, lineEnd);
  const out = block.split("\n")
    .map(l => prefix + l.replace(/^(?:\+{1,6}|[*#]+)\s+/, ""))
    .join("\n");
  ta.setSelectionRange(lineStart, lineEnd);
  putText(out, out.length, out.length);
}

function doInsert(item) {
  const ins = item.ins;
  if (ins.k === "ask") {
    askValue(item.t, ins.q, ins.def).then(v => {
      if (v === null) return;
      const real = ins.build(v);
      dispatch(real);
    });
    return;
  }
  dispatch(ins);
}
function dispatch(ins) {
  if (ins.k === "wrap") applyWrap(ins.pre, ins.post, ins.ph);
  else if (ins.k === "block") applyBlock(ins.text);
  else if (ins.k === "line") applyLine(ins.text);
}

/* ------------------------- 5. 输入弹窗 ------------------------- */
let dialogResolve = null;
function askValue(title, question, def) {
  return new Promise(resolve => {
    dialogResolve = resolve;
    els.dlgTitle.textContent = title;
    els.dlgTip.textContent = question;
    els.dlgInput.value = def || "";
    els.mask.classList.add("on");
    setTimeout(() => { els.dlgInput.focus(); els.dlgInput.select(); }, 30);
  });
}
function closeDialog(val) {
  els.mask.classList.remove("on");
  const r = dialogResolve; dialogResolve = null;
  if (r) r(val);
}
els.dlgOk.addEventListener("click", () => closeDialog(els.dlgInput.value));
els.dlgCancel.addEventListener("click", () => closeDialog(null));
els.dlgInput.addEventListener("keydown", ev => {
  if (ev.key === "Enter") { ev.preventDefault(); closeDialog(els.dlgInput.value); }
  if (ev.key === "Escape") { ev.preventDefault(); closeDialog(null); }
});
els.mask.addEventListener("mousedown", ev => { if (ev.target === els.mask) closeDialog(null); });

/* ------------------------- 6. 预览渲染器 ------------------------- */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* 行内标记 */
function inline(t) {
  if (!t) return "";
  // 内链 [[[page|text]]] / [[[page]]]
  t = t.replace(/\[\[\[([^\]\n]+?)\|([^\]\n]+?)\]\]\]/g,
        (m, p, x) => '<a href="#" data-page="' + p + '" title="' + p + '">' + x + "</a>");
  t = t.replace(/\[\[\[([^\]\n]+?)\]\]\]/g,
        (m, p) => '<a href="#" data-page="' + p + '" title="' + p + '">' + p + "</a>");
  // 外链 [http://x 文字]
  t = t.replace(/\[(https?:\/\/[^\s\]]+)(?:\s+([^\]]+))?\]/g,
        (m, u, x) => '<a href="' + u + '" target="_blank" rel="noreferrer">' + (x || u) + "</a>");
  // 颜色 ##hex|文字##（Wikidot 里 hex 不带 #，这里两种都兼容）
  t = t.replace(/##([#\w(),.%\s]+?)\|([\s\S]*?)##/g, (m, c, x) => {
    let col = c.trim();
    if (/^[0-9a-fA-F]{3,8}$/.test(col)) col = "#" + col;
    return '<span style="color:' + col + '">' + x + "</span>";
  });
  // 等宽 {{}}
  t = t.replace(/\{\{([^\n]+?)\}\}/g, (m, x) => '<code class="inline">' + x + "</code>");
  // 粗体 / 斜体 / 下划线 / 删除线 / 上下标
  t = t.replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(?<![:/\\])\/\/(?!\/)([^\n]+?)\/\//g, "<em>$1</em>");
  t = t.replace(/__([^\n]+?)__/g, "<u>$1</u>");
  t = t.replace(/(?<!-)--(?!-)([^\n]+?)--(?!-)/g, "<del>$1</del>");
  t = t.replace(/\^\^([^\n]+?)\^\^/g, "<sup>$1</sup>");
  t = t.replace(/(?<![,\w]),,([^\n]+?),,(?![,\w])/g, "<sub>$1</sub>");
  // 双斜杠收尾保护
  t = t.replace(/\*\*\*/g, "***");
  return t;
}

/* 块级标签 [[size]] [[span]] [[div]] …… → 真实 HTML */
function attr(a) {            // 把 [[div style="…"]] 的属性串规整成 " style=…"
  const s = (a || "").trim();
  return s ? " " + s : "";
}
function tokens(t) {
  t = t.replace(/\[\[span_\s*([^\]]*?)\]\]/g, (m, a) => '<div class="wiki-span-block"' + attr(a) + ">");
  t = t.replace(/\[\[\/span_\]\]/g, "</div>");
  t = t.replace(/\[\[\/span\]\]/g, "</span>");
  t = t.replace(/\[\[\/size\]\]/g, "</span>");
  t = t.replace(/\[\[span\s+([^\]]*?)\]\]/g, (m, a) => "<span" + attr(a) + ">");
  t = t.replace(/\[\[\/div\]\]/g, "</div>");
  t = t.replace(/\[\[div\b([^\]]*?)\]\]/g, (m, a) => "<div" + attr(a) + ">");
  t = t.replace(/\[\[size\s+([^\]]+?)\]\]/g, (m, v) => '<span style="font-size:' + v.trim() + '">');
  t = t.replace(/\[\[\/quote\]\]/g, "</blockquote>");
  t = t.replace(/\[\[quote\]\]/g, '<blockquote class="wiki-quote">');
  t = t.replace(/\[\[\/center\]\]/g, "</div>");
  t = t.replace(/\[\[center\]\]/g, '<div class="wiki-center">');
  // 折叠
  t = t.replace(/\[\[collapsible\b([^\]]*?)\]\]/g, (m, a) => {
    const show = /show\s*=\s*"([^"]*)"/.exec(a);
    const label = show ? show[1] : "+ 显示内容";
    return '<details class="wiki-collapsible"' + (/open\s*=\s*"?(true|yes)"?/.test(a) ? " open" : "") +
           "><summary>" + label + "</summary>";
  });
  t = t.replace(/\[\[\/collapsible\]\]/g, "</details>");
  // 标签页
  t = t.replace(/\[\[tabview\]\]/g, '<div class="wiki-tabs">');
  t = t.replace(/\[\[\/tabview\]\]/g, "</div>");
  t = t.replace(/\[\[tab\s+([^\]]+?)\]\]/g, (m, x) => '<div class="wiki-tab"><div class="wiki-tab-title">' + x + "</div>");
  t = t.replace(/\[\[\/tab\]\]/g, "</div>");
  // 图片
  t = t.replace(/\[\[image\s+([^\s\]]+)([^\]]*?)\]\]/g, (m, u, rest) => {
    const cap = /caption\s*=\s*"?([^"|\]]+)"?/.exec(rest);
    const link = /link\s*=\s*"?([^"\]]+)"?/.exec(rest);
    const alt = /alt\s*=\s*"?([^"\]]+)"?/.exec(rest);
    let img = '<img class="wiki-img" src="' + u + '" alt="' + (alt ? alt[1] : "image") + '">';
    if (link) img = '<a href="' + link[1] + '">' + img + "</a>";
    if (cap) img += '<div style="font-size:.85em;color:#666;margin:-.4em 0 .8em">' + cap[1] + "</div>";
    return img;
  });
  // 模块 / 引入 / 目录
  t = t.replace(/\[\[toc\]\]/gi, '<span class="wiki-ph">[[toc]] 目录</span>');
  t = t.replace(/\[\[\/module\]\]/gi, "");
  t = t.replace(/\[\[module\s+([^\]]+?)\]\]/gi, (m, a) => '<span class="wiki-ph">[[module ' + a + "]]</span>");
  t = t.replace(/\[\[include\s+([^\]]+?)\]\]/gi, (m, a) => '<span class="wiki-ph">[[include ' + a + "]]</span>");
  t = t.replace(/\[\[\/math\]\]/gi, "");
  t = t.replace(/\[\[math\]\]/gi, '<span class="wiki-ph">[[math]]</span>');
  // 注释
  t = t.replace(/\[!--[\s\S]*?--\]/g, "");
  return t;
}

/* 表格 */
function renderTable(rows) {
  // 有 ~ 标记就用 ~ 当表头；整张表都没有 ~ 时，第一行当表头
  const explicitHead = rows.some(r => /\|\|\s*~/.test(r));
  let html = '<table class="wiki-table">';
  rows.forEach((r, idx) => {
    let body = r.replace(/^\|\|/, "").replace(/\|\|\s*$/, "");
    const cells = body.split("||");
    html += "<tr>";
    cells.forEach(c => {
      const marked = /^\s*~/.test(c);
      const isHead = explicitHead ? marked : idx === 0;
      const cell = c.replace(/^\s*~/, "").trim();
      html += "<" + (isHead ? "th" : "td") + ">" + inline(tokens(cell)) + "</" + (isHead ? "th" : "td") + ">";
    });
    html += "</tr>";
  });
  return html + "</table>";
}

/* 列表 */
function renderList(items) {
  let html = '<div class="wiki-list">';
  const counters = {};
  items.forEach(it => {
    const marks = it[1], txt = it[2];
    const depth = marks.length;
    const ordered = marks[marks.length - 1] === "#";
    let bullet = "•";
    if (ordered) {
      counters[depth] = (counters[depth] || 0) + 1;
      for (const k in counters) if (+k > depth) delete counters[k];
      bullet = counters[depth] + ".";
    } else {
      for (const k in counters) if (+k >= depth) delete counters[k];
    }
    html += '<div class="wiki-li" style="margin-left:' + ((depth - 1) * 1.5) + 'em">' +
            bullet + " " + inline(txt) + "</div>";
  });
  return html + "</div>";
}

/* 一个「段落块」的渲染：块级结构 + 行内 */
const BRACE_OPEN = /<(?:div|span|details|blockquote|table|tr|td|th|ul|ol|li|pre|code)\b/gi;
const BRACE_CLOSE = /<\/(?:div|span|details|blockquote|table|tr|td|th|ul|ol|li|pre|code)>/gi;
function braceDelta(h) {
  return (h.match(BRACE_OPEN) || []).length - (h.match(BRACE_CLOSE) || []).length;
}

function renderChunk(chunk) {
  const lines = chunk.split("\n");
  let out = "", buf = [];
  const flush = () => {
    if (!buf.length) return;
    const joined = buf.join("<br>");
    // 若这段里开了容器但还没闭合，就不再套段落外壳，避免 div 被截断
    out += braceDelta(joined) > 0 ? joined : '<div class="para">' + joined + "</div>";
    buf = [];
  };

  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    if (!L.trim()) { flush(); continue; }

    // 标题
    let m = /^(\+{1,6})\s+(.*)$/.exec(L);
    if (m) {
      flush();
      const n = m[1].length;
      out += "<h" + n + ">" + inline(tokens(m[2])) + "</h" + n + ">";
      continue;
    }
    // 分割线
    if (/^-{4,}\s*$/.test(L)) { flush(); out += '<hr class="wiki-hr">'; continue; }
    // 表格
    if (/^\|\|/.test(L)) {
      flush();
      const rows = [];
      let j = i;
      while (j < lines.length && /^\|\|/.test(lines[j])) { rows.push(lines[j]); j++; }
      out += renderTable(rows);
      i = j - 1;
      continue;
    }
    // 列表
    m = /^([*#]+)\s+(.*)$/.exec(L);
    if (m) {
      flush();
      const items = [];
      let j = i, mm;
      while (j < lines.length && (mm = /^([*#]+)\s+(.*)$/.exec(lines[j]))) { items.push(mm); j++; }
      out += renderList(items);
      i = j - 1;
      continue;
    }
    // 引用（> 在转义后变成 &gt;）
    if (/^(?:&gt;)+/.test(L)) {
      flush();
      const qs = [];
      let j = i, qm;
      while (j < lines.length && (qm = /^(?:&gt;)+\s?(.*)$/.exec(lines[j]))) { qs.push(qm[1]); j++; }
      out += '<blockquote class="wiki-quote">' + qs.map(q => inline(tokens(q))).join("<br>") + "</blockquote>";
      i = j - 1;
      continue;
    }
    buf.push(inline(tokens(L)));
  }
  flush();
  return out;
}

/* 按空行切段落，但括号块（div / collapsible / tabview …）内部不切 */
const OPEN_RE = /\[\[(?:div|span_|span|size|collapsible|tabview|tab\b|quote|center|module|table|row|cell|hcell)\b/gi;
const CLOSE_RE = /\[\[\/(?:div|span_|span|size|collapsible|tabview|tab|quote|center|module|table|row|cell|hcell)\]/gi;

function splitChunks(src) {
  const lines = src.split("\n");
  const chunks = [];
  let cur = [], depth = 0;
  for (const L of lines) {
    const opens = (L.match(OPEN_RE) || []).length;
    const closes = (L.match(CLOSE_RE) || []).length;
    cur.push(L);
    depth += opens - closes;
    if (depth < 0) depth = 0;
    if (!L.trim() && depth === 0) {
      chunks.push(cur.join("\n"));
      cur = [];
    }
  }
  if (cur.length) chunks.push(cur.join("\n"));
  return chunks;
}

function renderWiki(src) {
  const store = [];   // 受保护的代码块 / 字面量
  const notes = [];   // 脚注
  let s = esc(String(src).replace(/\r\n?/g, "\n"));

  // 1) 代码块、原文块、字面量 → 占位符
  s = s.replace(/\[\[code(?:[^\]]*?)\]\]\n?([\s\S]*?)\n?\[\[\/code\]\]/gi, (m, body) => {
    store.push('<pre class="wiki-pre"><code>' + body.replace(/^\n|\n$/g, "") + "</code></pre>");
    return "\u0001" + (store.length - 1) + "\u0001";
  });
  s = s.replace(/\[\[html\]\]\n?([\s\S]*?)\n?\[\[\/html\]\]/gi, (m, body) => {
    store.push('<pre class="wiki-pre"><code>' + body.replace(/^\n|\n$/g, "") + "</code></pre>");
    return "\u0001" + (store.length - 1) + "\u0001";
  });
  s = s.replace(/@@([\s\S]*?)@@/g, (m, body) => {
    store.push('<code class="inline">' + body + "</code>");
    return "\u0001" + (store.length - 1) + "\u0001";
  });
  // 2) 脚注
  s = s.replace(/\[\[footnote\]\]([\s\S]*?)\[\[\/footnote\]\]/gi, (m, body) => {
    notes.push(body.replace(/\n/g, " "));
    return '<sup class="wiki-fn">[' + notes.length + "]</sup>";
  });

  // 3) 分块渲染
  let html = splitChunks(s).map(renderChunk).join("");

  // 4) 还原占位符
  html = html.replace(/\u0001(\d+)\u0001/g, (m, i) => store[+i] || "");

  // 5) 收尾整理：块级元素两侧多余的 <br>
  html = html.replace(/<br>\s*(<(?:div|details|blockquote|table|h[1-6]|hr|pre|ul|ol)\b)/g, "$1");
  html = html.replace(/(<\/(?:div|details|blockquote|table|h[1-6]|pre)>)\s*<br>/g, "$1");
  html = html.replace(/(<(?:div|details|blockquote|table)\b[^>]*>)\s*<br>/g, "$1");
  html = html.replace(/<br>\s*(<\/(?:div|details|blockquote|table|h[1-6]|pre)>)/g, "$1");

  // 6) 脚注列表
  if (notes.length) {
    html += '<div class="wiki-footnotes"><strong>脚注</strong><ol>' +
            notes.map(n => "<li>" + inline(tokens(n)) + "</li>").join("") + "</ol></div>";
  }
  if (!html.trim()) {
    html = '<div class="wiki-empty">← 在中间写点什么，这里会实时变成 SCP 文档的样子</div>';
  }
  return html;
}

/* ------------------------- 7. 更新 / 保存 ------------------------- */
function updatePreview() {
  const src = els.editor.value;
  els.wiki.innerHTML = renderWiki(src);
  // 内链点击不跳转（预览用）
  els.wiki.querySelectorAll("a[data-page]").forEach(a => {
    a.addEventListener("click", ev => ev.preventDefault());
  });
}

function updateStats() {
  const v = els.editor.value;
  const chars = v.length;
  els.chars.textContent = chars.toLocaleString("en-US") + " 字";
  els.fChars.textContent = chars.toLocaleString("en-US");
  els.fLines.textContent = v ? v.split("\n").length : 0;
}

function onChange() {
  updateStats();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(updatePreview, 90);

  clearTimeout(saveTimer);
  els.savedDot.classList.remove("on");
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, els.editor.value);
      els.savedDot.classList.add("on");
    } catch (e) { /* 存不下就算了 */ }
  }, 450);
}

els.editor.addEventListener("input", onChange);

/* Tab 插入两个空格，而不是切走焦点 */
els.editor.addEventListener("keydown", ev => {
  const ta = els.editor;
  if (ev.key === "Tab" && !ev.ctrlKey && !ev.altKey) {
    ev.preventDefault();
    putText("  ", 2, 2);
    return;
  }
  const mod = ev.ctrlKey || ev.metaKey;
  if (!mod) return;
  const k = ev.key.toLowerCase();
  if (k === "b") { ev.preventDefault(); applyWrap("**", "**", "粗体文字"); }
  else if (k === "i") { ev.preventDefault(); applyWrap("//", "//", "斜体文字"); }
  else if (k === "u") { ev.preventDefault(); applyWrap("__", "__", "下划线文字"); }
  else if (k === "d") { ev.preventDefault(); applyWrap("--", "--", "删除的文字"); }
  else if (k === "k") { ev.preventDefault(); doInsert(GROUPS[4].items[8]); }
  else if (k === "s") { ev.preventDefault(); copyAll(); }
});

/* ------------------------- 8. 顶栏动作 ------------------------- */
function copyAll() {
  const text = els.editor.value;
  const done = () => flash(document.getElementById("btnCopy"), "已复制 ✓");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, cb) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); cb(); } catch (e) { alert("复制失败，请手动全选复制"); }
  document.body.removeChild(ta);
}
function flash(btn, msg) {
  const old = btn.textContent;
  btn.textContent = msg;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1200);
}

document.getElementById("btnCopy").addEventListener("click", copyAll);

document.getElementById("btnDownload").addEventListener("click", () => {
  const blob = new Blob([els.editor.value], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "scp-wiki-" + new Date().toISOString().slice(0, 10) + ".txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
});

document.getElementById("btnClear").addEventListener("click", () => {
  if (!els.editor.value.trim() || confirm("确定清空编辑器里的全部内容？")) {
    els.editor.value = "";
    onChange();
    els.editor.focus();
  }
});

document.getElementById("btnDemo").addEventListener("click", () => {
  if (els.editor.value.trim() && !confirm("用示例内容替换当前内容？")) return;
  els.editor.value = DEMO;
  onChange();
});

document.getElementById("btnImport").addEventListener("click", () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".txt,.wikidot,text/plain";
  input.addEventListener("change", () => {
    const f = input.files && input.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { els.editor.value = String(fr.result || ""); onChange(); };
    fr.readAsText(f, "utf-8");
  });
  input.click();
});

els.reveal.addEventListener("change", () => {
  els.wiki.classList.toggle("reveal", els.reveal.checked);
});

/* ------------------------- 10. 启动 ------------------------- */
(function init() {
  buildTools();
  let saved = "";
  try { saved = localStorage.getItem(STORE_KEY) || ""; } catch (e) { saved = ""; }
  els.editor.value = saved || DEMO;
  updateStats();
  updatePreview();
  els.savedDot.classList.add("on");
})();
